services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    # The realm (clients, scopes, roles and users) is imported on start.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # A fixed issuer. Without it Keycloak writes into "iss" whatever host the
      # token request used, and a token fetched through another name than the
      # one the resource server trusts is rejected.
      KC_HOSTNAME: http://localhost:8180
    # 8180 because the application listens on 8080. The user's own containers
    # publish 27017, 8083 and 4873.
    ports:
      - "8180:8080"
    # Back-channel logout: Keycloak calls the application running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./keycloak/docs-realm.json:/opt/keycloak/data/import/docs-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
